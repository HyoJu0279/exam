<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="시험대비">
<meta name="theme-color" content="#E1E1E3">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<title>시험대비</title>
<style>
:root{
  --ink:#1D1D1F;--ink2:#48484C;--mut:#86868B;--mut2:#A9A9AE;--line:rgba(0,0,0,.07);--line2:rgba(0,0,0,.11);
  --card:rgba(248,248,249,.64);--card2:rgba(255,255,255,.78);--chip:rgba(0,0,0,.05);--dark:#1D1D1F;
  --r:28px;--shadow:0 14px 40px rgba(30,30,40,.08),0 1px 2px rgba(30,30,40,.04);
  --font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Noto Sans CJK KR",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--font);color:var(--ink);background:#DADADC;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
input,textarea,select{background:rgba(255,255,255,.7);border:1px solid var(--line2);border-radius:14px;padding:10px 12px;font-size:16px;outline:none;width:100%}
input:focus,textarea:focus,select:focus{border-color:#9C9CA2;background:#fff}
textarea{resize:vertical;min-height:84px;line-height:1.55}
/* 배경: 회색 그라데이션 + 유리구슬 */
.bg{position:fixed;inset:0;z-index:0;background:radial-gradient(120% 90% at 30% 0%,#F1F1F2 0%,#E1E1E3 45%,#CFCFD2 100%);overflow:hidden}
.orb{position:absolute;border-radius:50%;background:radial-gradient(circle at 32% 28%,#FFFFFF 0%,#F4F4F6 14%,#D7D7DB 42%,#B4B4BA 68%,#9C9CA3 82%,#C9C9CE 100%);box-shadow:inset -18px -26px 50px rgba(0,0,0,.14),inset 10px 12px 30px rgba(255,255,255,.7),0 40px 80px rgba(40,40,50,.18)}
.orb.glass{background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.95) 0%,rgba(255,255,255,.35) 22%,rgba(210,210,216,.25) 55%,rgba(160,160,170,.35) 85%,rgba(255,255,255,.6) 100%);box-shadow:inset -10px -16px 40px rgba(0,0,0,.08),inset 8px 10px 24px rgba(255,255,255,.9),0 30px 60px rgba(40,40,50,.10)}
.ring{position:absolute;border-radius:50%;background:radial-gradient(circle at 50% 50%,transparent 0 52%,rgba(255,255,255,.0) 52%,#C7C7CC 55%,#F7F7F9 62%,#FFFFFF 66%,#D4D4D9 72%,#A9A9B0 78%,#E2E2E6 83%,transparent 84%);filter:drop-shadow(0 24px 40px rgba(40,40,50,.16))}
.app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;padding:max(14px,env(safe-area-inset-top)) 22px 0}
/* 상단 */
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px;flex:none}
.brand{font-size:22px;font-weight:700;letter-spacing:-.6px;white-space:nowrap}
.tabs{display:flex;gap:2px;padding:4px;border-radius:999px;background:var(--card2);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);box-shadow:var(--shadow);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:9px 15px;border-radius:999px;font-size:15px;color:var(--ink2);white-space:nowrap}
.tab.on{background:var(--dark);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;padding:10px 16px;font-size:15px;background:var(--chip);color:var(--ink);white-space:nowrap}
.btn.dark{background:var(--dark);color:#fff}
.btn.sm{padding:7px 12px;font-size:13.5px}
.btn.xs{padding:4px 10px;font-size:12.5px}
.btn.ghost{background:transparent;border:1px solid var(--line2)}
.btn.white{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.btn.danger{color:#B4383F}
.btn:active{transform:scale(.97)}
.circ{width:38px;height:38px;border-radius:50%;background:var(--chip);display:inline-flex;align-items:center;justify-content:center;font-size:17px;flex:none}
.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:28px;margin:0 -22px;padding-left:22px;padding-right:22px}
.card{background:var(--card);backdrop-filter:blur(30px) saturate(1.7);-webkit-backdrop-filter:blur(30px) saturate(1.7);border:1px solid rgba(255,255,255,.75);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.9);min-width:0}
.card.solid{background:rgba(250,250,251,.9)}
.glass{background:rgba(255,255,255,.42);backdrop-filter:blur(26px) saturate(1.8);-webkit-backdrop-filter:blur(26px) saturate(1.8);border:1px solid rgba(255,255,255,.9);box-shadow:0 18px 44px rgba(30,30,40,.14),inset 0 1px 0 #fff}
.lab{font-size:13px;color:var(--mut)}
.mut{color:var(--mut)}
.chead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.row{display:flex;align-items:center;gap:8px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note{font-size:13px;color:var(--mut);line-height:1.5}
.empty{padding:22px 6px;text-align:center;color:var(--mut);font-size:14px}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--chip)}
.seg button{padding:6px 12px;border-radius:999px;font-size:13px;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.chk{width:24px;height:24px;border-radius:50%;border:1.6px solid #BDBDC2;flex:none;display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:#fff;background:transparent}
.chk.on{background:var(--dark);border-color:var(--dark)}
.sq{border-radius:7px}
/* 홈 */
.home{display:grid;grid-template-columns:300px minmax(0,1fr) 290px;gap:16px;align-items:start}
.home .col{display:flex;flex-direction:column;gap:14px;min-width:0}
.dday-l{font-size:15px;color:var(--mut)}
.dday{font-size:112px;font-weight:800;line-height:.95;letter-spacing:-2px;margin:6px 0 10px -3px;white-space:nowrap}
.dd-dash{display:inline-block;margin:0 .07em;font-weight:700}
.dday.txt{font-size:84px;letter-spacing:-1.5px}
.verse{font-size:21px;line-height:1.6;font-weight:500;letter-spacing:-.3px;white-space:pre-wrap;word-break:keep-all}
.vow{background:rgba(255,255,255,.55);border-radius:18px;padding:12px 14px;margin-top:14px}
.now-card{position:relative;z-index:3;margin:0 16px -36px;border-radius:26px;padding:16px 20px}
.bar{height:7px;border-radius:4px;background:rgba(0,0,0,.07);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:4px}
.tt-card{padding-top:52px}
.bignum{font-size:32px;font-weight:800;letter-spacing:-1px;line-height:1}
.todo{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.todo:first-child{border-top:0}
.todo.done .tx{color:var(--mut2);text-decoration:line-through}
.prog{display:grid;grid-template-columns:36px 1fr 40px;gap:10px;align-items:center;font-size:14px;margin:8px 0}
.prog .t{height:8px;border-radius:4px;background:rgba(0,0,0,.06);overflow:hidden}
.prog .t>i{display:block;height:100%;border-radius:4px}
.prog .v{text-align:right;font-size:12.5px;color:var(--mut)}
/* 타임라인 */
.tl{position:relative}
.tl-grid{display:grid;grid-template-columns:34px minmax(0,1fr);row-gap:10px}
.lane{position:relative;height:76px}
.tl-b{position:absolute;top:0;height:76px;border-radius:18px;padding:8px 10px;font-size:14px;overflow:hidden;white-space:nowrap;display:flex;flex-direction:column;justify-content:center;gap:1px}
.tl-b small{font-size:11.5px;opacity:.85;font-weight:400}
.tl-miss{position:absolute;top:0;height:76px;border-radius:12px;border:1.5px dashed #C4C4C9;color:var(--mut);display:flex;align-items:center;justify-content:center;font-size:15px}
.tl-now{position:absolute;width:2px;background:var(--ink);border-radius:2px;z-index:2}
.tl-bub{position:absolute;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;z-index:3}
.hr{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.mini{position:relative;height:40px;cursor:pointer}
/* 시간표: 세로 하루 보기 */
.dv-head{display:grid;grid-template-columns:42px 1fr 1fr;gap:30px;margin-bottom:8px}
.dv{position:relative}
.dv-line{position:absolute;left:34px;right:0;height:1px;background:var(--line)}
.dv-h{position:absolute;left:0;width:28px;text-align:right;font-size:12.5px;color:var(--mut)}
.dv-col{position:absolute;top:0;bottom:0}
.dv-b{position:absolute;left:0;right:0;border-radius:12px;padding:6px 10px;font-size:14px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-start;gap:2px;text-align:left}
.dv-b b{font-weight:700;min-width:0}
.dv-b small{font-size:12px;opacity:.85;font-weight:400}
.dv-badge{flex:none;font-size:11.5px;font-weight:600;border-radius:999px;padding:1px 8px;white-space:nowrap}
.dv-miss{position:absolute;left:0;right:0;border-radius:12px;border:1.5px dashed #C4C4C9;color:var(--mut);font-size:12.5px;display:flex;align-items:center;justify-content:center}
.dv-now{position:absolute;left:36px;right:0;height:2px;background:var(--ink);z-index:2}
.dv-bub{position:absolute;left:-6px;background:var(--ink);color:#fff;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 6px;z-index:3}
/* 시간표 격자 */
.tt-wrap>.card:last-child{position:sticky;top:0;max-height:calc(100vh - 110px);overflow-y:auto}
.tt-wrap{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
.grid-row{display:grid;grid-template-columns:30px repeat(6,minmax(0,1fr));gap:4px;margin-bottom:4px}
.grid-row .h{font-size:12.5px;color:var(--mut);align-self:center}
.cell{height:30px;border-radius:8px;background:rgba(255,255,255,.55);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--mut)}
.cell .f{position:absolute;left:0;top:0;bottom:0}
.cell .x{position:relative}
.cell.now{box-shadow:inset 0 0 0 2.5px var(--ink)}
.blist .bi{display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid var(--line);font-size:14.5px}
.blist .bi:first-child{border-top:0}
.blist .tm{width:96px;font-size:13px;color:var(--mut);flex:none}
/* 시트 */
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(30,30,34,.28);display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .18s}
.sheet{width:min(560px,100%);max-height:calc(100% - 40px);overflow:auto;background:rgba(248,248,250,.94);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-radius:30px;box-shadow:0 30px 80px rgba(0,0,0,.25);padding:22px 22px 18px;animation:pop .2s}
.sheet.wide{width:min(860px,100%)}
.sheet h2{font-size:20px;font-weight:700;letter-spacing:-.4px;margin-bottom:14px}
.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field>span{font-size:13px;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 13px;border-radius:999px;background:var(--chip);font-size:14px}
.chip.on{background:var(--dark);color:#fff}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);z-index:90;background:var(--dark);color:#fff;border-radius:999px;padding:11px 18px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.2);animation:pop .2s}
/* 할 일 보드 */
.board{display:flex;align-items:flex-start;gap:12px;overflow-x:auto;padding-bottom:10px;-webkit-overflow-scrolling:touch}
.bcol{flex:none;width:214px;padding:14px}
.bcol.exam{outline:2px solid rgba(0,0,0,.08)}
.bcol.today{box-shadow:var(--shadow),inset 0 0 0 2px var(--ink)}
.btodo{display:flex;gap:7px;align-items:flex-start;padding:8px 9px;border-radius:14px;background:rgba(255,255,255,.65);margin-top:6px;font-size:13.5px;line-height:1.35;text-align:left;width:100%}
.btodo.done{opacity:.45;text-decoration:line-through}
/* 전과목계획 */
.grp{padding:12px 0;border-top:1px solid var(--line)}
.grp:first-child{border-top:0}
.item{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:14.5px}
.item.done .tx{color:var(--mut2);text-decoration:line-through}
.dchip{font-size:11.5px;border-radius:999px;padding:2px 8px;background:var(--chip);color:var(--ink2);white-space:nowrap}
/* 기록 */
.stat-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
/* 타이머 */
.tm-root{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;user-select:none;-webkit-user-select:none}
.tm-root.focus{background:#000;color:#fff}
.tm-root.brk{background:#fff;color:#000}
.tm-root.res{background:#F2F2F4;color:var(--ink)}
.tm-head{position:absolute;top:max(48px,env(safe-area-inset-top));left:0;right:0;text-align:center;font-size:17px;opacity:.75;padding:0 30px}
.tm-head b{display:block;font-size:15px;font-weight:600;opacity:.8;margin-bottom:4px}
.tm-num{font-size:min(26vw,40vh);font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.tm-btns{position:absolute;bottom:max(56px,env(safe-area-inset-bottom));display:flex;gap:28px}
.tm-btn{width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.focus .tm-btn{background:rgba(255,255,255,.14)}
.brk .tm-btn{background:rgba(0,0,0,.07)}
.tm-btn svg{width:34px;height:34px;fill:currentColor}
.tm-verse{position:absolute;bottom:170px;left:0;right:0;text-align:center;font-size:16px;line-height:1.6;color:#555;padding:0 60px;white-space:pre-wrap}
.res-card{width:min(560px,100%);padding:26px}
.res-row{display:flex;justify-content:space-between;padding:11px 0;border-top:1px solid var(--line);font-size:15.5px}
.res-row:first-of-type{border-top:0}
/* 흐름(정오표·마음 다잡기) */
.flow{position:fixed;inset:0;z-index:70;background:rgba(222,222,225,.86);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);display:flex;align-items:center;justify-content:center;padding:26px;overflow:auto}
.flow-card{width:min(760px,100%);max-height:100%;overflow:auto;padding:28px}
.flow h1{font-size:26px;font-weight:800;letter-spacing:-.6px}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.q{border-radius:16px;background:rgba(255,255,255,.7);padding:8px 6px;text-align:center;font-size:15px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:58px;justify-content:center}
.q.x{background:#fff;box-shadow:inset 0 0 0 2px var(--ink)}
.q input{width:100%;padding:4px 6px;font-size:14px;text-align:center;border-radius:9px}
.score{font-size:120px;font-weight:800;letter-spacing:-5px;line-height:1}
.pray{display:flex;flex-direction:column;align-items:center;gap:22px;padding:30px 10px}
.seal{width:120px;height:120px;border-radius:50%;margin:0 auto}
/* 세로 화면·작은 화면 */
@media (max-width:1000px){
  .home{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .home .col.mid{grid-column:1 / -1;order:-1}
  .tt-wrap{grid-template-columns:1fr}
  .dday{font-size:92px}
}
@media (max-width:640px){
  .home{grid-template-columns:1fr}
  .app{padding-left:14px;padding-right:14px}
  .stat-row{grid-template-columns:repeat(2,minmax(0,1fr))}
}

</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<div class="app" id="app"></div>
<script>
/* ===== 고정 데이터: 과목, 시간표 틀, 시험 일정, 전과목계획 ===== */
var SUBJECTS = ['국어', '수학', '영어', '사회', '과학', '역사', '기타'];
var EXAM_SUBJECTS = ['역사', '국어', '사회', '영어', '과학', '수학'];
/* 파스텔: [연한 바탕, 진한 글자·띠, 중간 채움] */
var COLORS = {
  '국어': ['#F9DEDA', '#B5443A', '#F0B5AD'],
  '수학': ['#D9E6F8', '#3C68AE', '#B0C9EE'],
  '영어': ['#F8EDC6', '#8F6A0E', '#EFD686'],
  '사회': ['#DCF0DF', '#3B8550', '#B1DCBB'],
  '과학': ['#EBF4CC', '#647F12', '#D3E793'],
  '역사': ['#E6E0F8', '#6C57BE', '#C9BDF0'],
  '기타': ['#E6E6E8', '#6B6B70', '#CFCFD4'],
  '생활': ['#E4E4E6', '#8A8A8F', '#D2D2D6']
};
/* 상태 표시 색: [바탕, 글자] */
var STATUS = { ok: ['#DCF0DF', '#2F6E40'], other: ['#F8EDC6', '#7A5A0C'], off: ['#F9DEDA', '#9E3A31'] };

/* 교시 시각 */
var PERIODS = { 1: ['08:20', '09:10'], 2: ['09:20', '10:10'], 3: ['10:20', '11:10'], 4: ['11:20', '12:10'], 5: ['13:10', '14:00'], 6: ['14:10', '15:00'], 7: ['15:10', '16:00'] };
var WEEK_CLASSES = {
  1: ['수학Be', '사회C', '역사A', '국어B', '과학D', '실험e'],
  2: ['과학A', '국어B', '수학A', '미술', '체육', '영어C', '역사C'],
  3: ['사회A', '체육', '미술', '미술', '국어A', '과학C'],
  4: ['수학B', '회화', '역사B', '사회B', '영어A', '영어A', '국어A'],
  5: ['수학A', '과학B', '사회A', '영어B']
};
/* 수업 이름 → 큰 과목 (자습으로 바꿀 때 기본 과목) */
function classFamily(name) {
  var m = { '국': '국어', '수': '수학', '영': '영어', '사': '사회', '과': '과학', '역': '역사' };
  if (/^실험/.test(name)) return '과학';
  if (/^회화/.test(name)) return '영어';
  return m[name.charAt(0)] || '기타';
}

var EXAMS_DEFAULT = [
  { id: 'his', subject: '역사', date: '2026-12-07', start: '08:20', end: '09:10' },
  { id: 'kor', subject: '국어', date: '2026-12-08', start: '08:20', end: '09:10' },
  { id: 'soc', subject: '사회', date: '2026-12-09', start: '08:20', end: '09:10' },
  { id: 'eng', subject: '영어', date: '2026-12-09', start: '09:30', end: '10:20' },
  { id: 'sci', subject: '과학', date: '2026-12-10', start: '08:20', end: '09:10' },
  { id: 'mat', subject: '수학', date: '2026-12-11', start: '08:20', end: '09:10' }
];

    var p = a;
    cov.forEach(function (g) { if (g.s > p) gaps.push([p, Math.min(g.s, end)]); p = Math.max(p, g.e); });

}

/* ---------- 원형 시계 ---------- */
function dialHTML(day) {
  var R1 = 138, R2 = 112, R3 = 90, C = 160, nowM = nowMinFor(day), isToday = day === studyToday();
  var ang = function (m) { return (m % 1440) / 1440 * 360 - 90; };
  var arc = function (a, b, ro, ri, fill, extra) {
    var gap = 0.5, a0 = (ang(a) + gap) * Math.PI / 180, a1 = (ang(b) - gap) * Math.PI / 180;
    if (b - a >= 1440) a1 = a0 + 2 * Math.PI - 0.001;
    while (a1 <= a0) a1 += 2 * Math.PI;
    var lg = a1 - a0 > Math.PI ? 1 : 0;
    var p = function (r, t) { return (C + r * Math.cos(t)).toFixed(1) + ',' + (C + r * Math.sin(t)).toFixed(1); };
    return '<path d="M' + p(ro, a0) + ' A' + ro + ',' + ro + ' 0 ' + lg + ' 1 ' + p(ro, a1) + ' L' + p(ri, a1) + ' A' + ri + ',' + ri + ' 0 ' + lg + ' 0 ' + p(ri, a0) + ' Z" fill="' + fill + '"' + (extra || '') + '/>';
  };
  var svg = '<circle cx="' + C + '" cy="' + C + '" r="' + R1 + '" fill="rgba(255,255,255,.55)"/><circle cx="' + C + '" cy="' + C + '" r="' + (R3 - 4) + '" fill="#fff"/>';
  blocksOf(day).forEach(function (b) { svg += arc(b.s, b.e, R1, R2 + 3, isStudy(b) || b.type === 'exam' ? col(b.subject, 0) : 'rgba(0,0,0,.08)'); });
  var segs = actualSegs(day);
  mergeSegs(segs).forEach(function (g) { if (g.e - g.s >= 1) svg += arc(g.s, g.e, R2 - 1, R3, col(g.subject, 2)); });
  missedGaps(day, segs, nowM).forEach(function (g) { svg += arc(g[0], g[1], R2 - 1, R3, 'none', ' stroke="#BDBDC2" stroke-dasharray="3 3" stroke-width="1.2"'); });
  for (var h = 0; h < 24; h += 3) {
    var t = (h / 24 * 360 - 90) * Math.PI / 180;
    svg += '<text x="' + (C + (R1 + 13) * Math.cos(t)).toFixed(1) + '" y="' + (C + (R1 + 13) * Math.sin(t) + 4).toFixed(1) + '" font-size="11" fill="#86868B" text-anchor="middle">' + h + '</text>';
  }
  if (isToday) {
    var tn = ang(nowM) * Math.PI / 180;
    svg += '<line x1="' + C + '" y1="' + C + '" x2="' + (C + (R1 + 4) * Math.cos(tn)).toFixed(1) + '" y2="' + (C + (R1 + 4) * Math.sin(tn)).toFixed(1) + '" stroke="#1D1D1F" stroke-width="2.5" stroke-linecap="round"/><circle cx="' + C + '" cy="' + C + '" r="5" fill="#1D1D1F"/>';
  }
  var list = blocksOf(day).filter(function (b) { return (isStudy(b) || b.type === 'exam') && b.e > nowM; }).slice(0, 4);
  var side = list.map(function (b) {
    var st = isStudy(b) ? blockStat(day, b, segs, nowM) : null, on = b.s <= nowM;
    return '<div style="padding:9px 0;border-top:1px solid var(--line)"><div class="row">' + dot(b.subject) + '<b style="font-weight:700">' + esc(b.subject) + '</b>' + (on ? '<span class="pill" style="background:var(--dark);color:#fff;font-size:11px;padding:1px 8px">지금</span>' : '') +
      '<span class="lab" style="margin-left:auto">' + hm(b.s) + '</span></div><div class="ell" style="font-size:13.5px;color:var(--ink2);margin-top:2px">' + esc(b.type === 'exam' ? '시험' : (blockTitle(b).split(' · ').slice(1).join(' · ') || hm(b.s) + '–' + hm(b.e))) + (on && st ? ' · ' + Math.round(st.same) + '/' + st.total + '분' : '') + '</div></div>';
  }).join('') || '<div class="empty">남은 공부 블록이 없어요</div>';
  return '<div class="row" style="align-items:flex-start;gap:16px"><div style="position:relative;width:320px;height:320px;flex:none;max-width:100%">' +
    '<svg viewBox="0 0 320 320" width="320" height="320" style="max-width:100%;height:auto">' + svg + '</svg>' +
    '<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;padding-top:70px"><span class="lab">오늘 공부</span><b style="font-size:20px;font-weight:800">' + fmtHM(studyMsOn(day)) + '</b></div></div>' +

  var before = 0; Object.keys(counts).forEach(function (d) { if (d < days[0]) before += counts[d]; });
  var W = 700, H = 170, L = 44, R = 14, T = 12, B = 26, n = days.length, step = (W - L - R) / Math.max(1, n - 1), acc = before, pts = [];
  var y = function (p) { return T + (H - T - B) * (1 - p / 100); };
  var s = '';
  [0, 50, 100].forEach(function (p) { s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(p) + '" y2="' + y(p) + '" stroke="rgba(0,0,0,.06)"/><text x="' + (L - 6) + '" y="' + (y(p) + 4) + '" font-size="11" fill="#86868B" text-anchor="end">' + p + '%</text>'; });
  days.forEach(function (d, i) {
    var x = L + step * i;
    if (d <= t) { acc += counts[d] || 0; pts.push([x, y(total ? acc / total * 100 : 0)]); }
    if (i % 2 === 0) s += '<text x="' + x + '" y="' + (H - 8) + '" font-size="10.5" fill="#86868B" text-anchor="middle">' + fmtMD(d).replace(/^\d+\./, '') + '</text>';
  });
  if (pts.length) {
    s += '<polygon fill="rgba(29,29,31,.06)" points="' + pts[0][0] + ',' + y(0) + ' ' + pts.map(function (p) { return p.join(','); }).join(' ') + ' ' + pts[pts.length - 1][0] + ',' + y(0) + '"/>';
    s += '<polyline fill="none" stroke="#1D1D1F" stroke-width="2" points="' + pts.map(function (p) { return p.join(','); }).join(' ') + '"/>';
    var lp = pts[pts.length - 1]; s += '<circle cx="' + lp[0] + '" cy="' + lp[1] + '" r="4" fill="#1D1D1F"/>';
  }
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto">' + s + '</svg>';
}
function subjBars() {
  var by = studyMsBySubject('2000-01-01', '2999-12-31'), mx = Math.max.apply(null, SUBJECTS.map(function (s) { return by[s] || 0; }).concat([1]));
  return SUBJECTS.map(function (s) { var v = by[s] || 0; return '<div class="prog" style="grid-template-columns:36px 1fr 70px"><span>' + s + '</span><span class="t" style="height:10px"><i style="width:' + (v / mx * 100) + '%;background:' + col(s, 1) + '"></i></span><span class="v">' + fmtHM(v) + '</span></div>'; }).join('');
}
function sessionsCard() {
  var day = ui.statDay || (ui.statDay = studyToday());
  var list = S.sessions.filter(function (s) { return (s.segs || []).some(function (g) { return studyDayOf(g[0]) === day; }); }).sort(function (a, b) { return a.start - b.start; });
  return '<div class="card"><div class="chead"><div class="row"><button class="circ" style="width:32px;height:32px" data-act="sd-move" data-d="-1">‹</button><b>' + fmtMD(day) + ' ' + wk(day) + ' 공부 기록</b><button class="circ" style="width:32px;height:32px" data-act="sd-move" data-d="1">›</button></div><button class="btn sm white" data-act="manual-add">+ 직접 입력</button></div>' +
    (list.length ? list.map(function (s) {
      var t = s.todoId && todoById(s.todoId);
      return '<div class="todo"><span class="lab" style="width:104px">' + hm(tsToMin(day, s.start)) + '–' + hm(tsToMin(day, s.end)) + '</span>' + subjPill(s.subject) + '<span class="grow ell">' + esc(t ? t.text : (s.title || '과목 자유 공부')) + (s.manual ? ' <span class="dchip">직접 입력</span>' : '') + '</span><b style="font-size:14px">' + fmtHM(s.focusMs) + '</b><button class="btn xs danger" data-act="sess-del" data-id="' + s.id + '">삭제</button></div>';
    }).join('') : '<div class="empty">이 날 기록이 없어요</div>') + '</div>';
}
ACTS['sd-move'] = function (el) { ui.statDay = addDays(ui.statDay, +el.dataset.d); render(); };
ACTS['manual-add'] = function () { openManualEntry(ui.statDay); };
ACTS['sess-del'] = function (el) {
  confirmBox('기록 삭제', '이 공부 기록을 지울까요? 공부 시간, 지킴률, 할 일 옆 시간에서도 함께 빠져요.', '삭제', true).then(function (ok) {
    if (!ok) return; S.sessions = S.sessions.filter(function (s) { return s.id !== el.dataset.id; }); save(); render();
  });
};
function backupCard() {
  return '<div class="card"><div class="lab" style="margin-bottom:8px">백업</div><p class="note" style="margin-bottom:12px">기록은 이 아이패드 안에만 저장돼요. 가끔 파일로 저장해 두면, 홈 화면 앱을 지우거나 기기를 바꿔도 불러올 수 있어요.</p>' +
    '<div class="row wrap"><button class="btn dark sm" data-act="backup">파일로 저장</button><label class="btn sm white" style="cursor:pointer">불러오기<input type="file" accept="application/json,.json" id="restore" style="display:none"></label></div>' +
    '<div class="lab" style="margin:18px 0 8px">설정</div><div class="row wrap"><button class="btn sm white" data-act="exam-settings">시험 일정 수정</button><button class="btn sm white danger" data-act="wipe">모든 기록 지우기</button></div></div>';
}
ACTS.backup = function () {
  var blob = new Blob([JSON.stringify({ app: 'exam', at: nowTs(), state: S }, null, 0)], { type: 'application/json' });
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = '시험대비-백업-' + calToday() + '.json';
  document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast('백업 파일을 만들었어요');
};
document.addEventListener('change', function (e) {
  if (e.target.id !== 'restore' || !e.target.files[0]) return;
  var rd = new FileReader();
  rd.onload = function () {
    try {
      var j = JSON.parse(rd.result); if (!j || j.app !== 'exam' || !j.state) throw new Error('x');
      confirmBox('백업 불러오기', '지금 기록을 백업 파일 내용으로 바꿀까요?', '불러오기').then(function (ok) { if (!ok) return; S = j.state; save(); load(); render(); toast('불러왔어요'); });
    } catch (err) { toast('시험대비 백업 파일이 아니에요'); }
  };
  rd.readAsText(e.target.files[0]);
  e.target.value = '';
});
ACTS.wipe = function () {
  confirmBox('모든 기록 지우기', '시간표, 할 일, 공부 기록, 기도와 묵상, 정오표가 모두 지워져요. 먼저 백업을 해 두는 걸 권해요.', '모두 지우기', true).then(function (ok) {
    if (!ok) return;
    confirmBox('정말 지울까요?', '지운 기록은 되돌릴 수 없어요.', '지우기', true).then(function (ok2) { if (!ok2) return; S = freshState(); save(); _tm = null; saveTimer(); render(); toast('모두 지웠어요'); });
  });
};

/* ===== 시작 ===== */
(function () {
  load();
  loadTimer();
  ui.ttDay = studyToday();
  render();
  if (_tm) showTimer();
})();

</script>
